<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/manus-storage/das-logo_13aa1dbe.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>EMR-DAS Referral Game</title>
    <meta name="description" content="EMR-DAS Donor Alert Simulator — triage patients and refer them to the SHARE donor coordinator team." />
    <style>
      html, body { margin: 0; background-color: #050b14; }
      #root { min-height: 100vh; }
      /* Visible loading state so a slow or failed JS load never shows a blank page */
      #loading-overlay {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #050b14; color: #e2e8f0;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        transition: opacity 0.3s ease;
      }
      #loading-overlay.hidden { opacity: 0; pointer-events: none; }
      #loading-overlay .spinner { width: 36px; height: 36px; border-radius: 50%; border: 3px solid rgba(255,179,25,0.15); border-top-color: #ffb319; animation: das-spin 0.9s linear infinite; margin-bottom: 16px; }
      @keyframes das-spin { to { transform: rotate(360deg); } }
      #loading-overlay .msg { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #64748b; }
      #loading-overlay .retry {
        margin-top: 20px; padding: 8px 18px; border: 1px solid #ffb319; color: #ffb319;
        background: transparent; font-family: inherit; font-size: 12px; letter-spacing: 0.1em;
        text-transform: uppercase; cursor: pointer;
      }
      #loading-overlay .retry:hover { background: rgba(255,179,25,0.12); }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div id="loading-overlay">
      <div class="spinner"></div>
      <div class="msg">Initializing EMR-DAS Console&hellip;</div>
      <button class="retry" id="retry-btn" style="display:none" onclick="window.location.reload()">Retry Loading</button>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide the loading overlay as soon as the app mounts; show a retry button if it takes too long
      (function () {
        var overlay = document.getElementById('loading-overlay');
        var retryBtn = document.getElementById('retry-btn');
        var timeout = setTimeout(function () {
          retryBtn.style.display = 'block';
          overlay.querySelector('.msg').textContent = 'Loading stalled — check your connection';
        }, 6000);
        window.__dasReady = function () {
          clearTimeout(timeout);
          overlay.classList.add('hidden');
          setTimeout(function () { overlay.remove(); }, 350);
        };
      })();
    </script>
  </body>

</html>
